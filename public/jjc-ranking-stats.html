        async function ensureDetailLoaded(detailsNode) {
            if (!(detailsNode instanceof HTMLElement) || !detailsNode.open) {
                return;
            }
            const detailListNode = detailsNode.querySelector(".detail-list");
            if (!(detailListNode instanceof HTMLElement)) {
                return;
            }

            const rangeKey = detailsNode.dataset.range || "";
            const lane = detailsNode.dataset.lane || "";
            const kungfu = decodeURIComponent(detailsNode.dataset.kungfu || "");
            if (!currentStatsTimestamp || !rangeKey || !lane || !kungfu) {
                detailListNode.innerHTML = "<div class='muted'>缺少详情参数</div>";
                return;
            }

            if (equipmentViewState?.current && !isPeakTab(currentOuterTab)) {
                const members = equipmentAPI.visibleMembers(equipmentViewState.current, rangeKey, currentOuterTab)
                    .filter(member => member.lane === lane && (member.kungfu || "未知") === kungfu);
                detailListNode.innerHTML = renderDetailContent(members);
                detailListNode.dataset.loaded = "true";
                return;
            }
            const detailSource = currentOuterTab === "peak-game" ? "peak-game" : "ranking";
            const anchor = currentStatsTimestamp;
            const tab = currentOuterTab;
            const cacheKey = buildDetailsCacheKey(detailSource, currentStatsTimestamp, rangeKey, lane, kungfu);
            if (detailCache.has(cacheKey)) {
                const cachedMembers = detailCache.get(cacheKey) || [];
                if (detailSource === "ranking") rememberRankingDisplayMembers(cachedMembers);
                detailListNode.innerHTML = renderDetailContent(cachedMembers, detailSource === "ranking" ? rankingDisplayRecords() : new Map());
                detailListNode.dataset.loaded = "true";
                activateRankingDisplays();
                return;
            }

            detailListNode.innerHTML = "<div class='muted'>正在加载明细...</div>";
            try {
                const detailsUrl = currentOuterTab === "peak-game"
                    ? buildPeakDetailsUrl(currentStatsTimestamp, "game", rangeKey, kungfu)
                    : buildDetailsUrl(currentStatsTimestamp, rangeKey, lane, kungfu);
                const response = await fetch(detailsUrl, { cache: "no-store" });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const payload = await response.json();
                const data = unwrapResponse(payload);
                const members = Array.isArray(data.members) ? data.members : [];
                detailCache.set(cacheKey, members);
                if (currentStatsTimestamp !== anchor || currentOuterTab !== tab || !detailsNode.isConnected || !detailsNode.open) return;
                if (detailSource === "ranking") rememberRankingDisplayMembers(members);
                detailListNode.innerHTML = renderDetailContent(members, detailSource === "ranking" ? rankingDisplayRecords() : new Map());
                detailListNode.dataset.loaded = "true";
                activateRankingDisplays();
            } catch (error) {
                if (currentStatsTimestamp !== anchor || currentOuterTab !== tab || !detailsNode.isConnected) return;
                detailListNode.innerHTML = `<div class='muted error'>加载明细失败：${escapeHtml(error.message || error)}</div>`;
                detailListNode.dataset.loaded = "false";
                activateRankingDisplays();
            }
        }

        function renderList(rangeKey, laneName, list, validCount, legendaryCountMap, overlayEnabled = showLegendaryOverlay) {
            const maxCount = list.reduce((maxValue, item) => Math.max(maxValue, item[1]), 1);
            return list.map(([kungfu, count]) => {
                const percent = validCount > 0 ? (count / validCount) * 100 : 0;
                const legendaryCount = Number((legendaryCountMap || {})[kungfu] || 0);
                const legendaryPercent = count > 0 ? (legendaryCount / count) * 100 : 0;
                const overlayPercent = overlayEnabled ? legendaryPercent : 0;
                return `
                    <details class="detail" data-range="${rangeKey}" data-lane="${laneName}" data-kungfu="${encodeURIComponent(kungfu)}">
                        <summary>
                            <div class="bar-row">
                                <div class="bar-kungfu"><span class="arrow">›</span>${escapeHtml(kungfu)}</div>
                                <div class="bar">
                                    <div class="bar-fill" style="width:${(count / maxCount) * 100}%">
                                        <div class="bar-legendary" style="width:${overlayPercent}%"></div>
                                    </div>
                                </div>
                                <div class="bar-value">${count}</div>
                                <div class="bar-percent">${percent.toFixed(1)}%</div>
                            </div>
                        </summary>
                        <div class="detail-list" data-loaded="false">
                            <div class='muted'>展开后加载明细</div>
                        </div>
                    </details>
                `;
            }).join("");
        }

        function hasIncompleteEquipment(...lanes) {
            return lanes.some((lane) => Boolean(lane?.equipment_incomplete));
        }

        function renderKungfuCoverage(stats) {
            if (stats.equipment_source === "local_win_v2") {
                const metrics = stats.source_equipment_metrics || stats.equipment_metrics || {};
                const coverage = metrics.equipment_coverage == null ? "--" : `${(metrics.equipment_coverage*100).toFixed(1)}%`;
                const cache = stats.kungfu_cache || {};
                return `心法覆盖 ${((cache.coverage || 0)*100).toFixed(1)}% · 装备覆盖 ${coverage} · 装备未知 ${metrics.U || 0}`;
            }
            const cache = stats.kungfu_cache;
            if (!cache) return "心法覆盖率未记录";
            const coverage = (Number(cache.coverage || 0) * 100).toFixed(1);
            const equipment = hasIncompleteEquipment(stats.healer, stats.dps);
            return `心法覆盖 ${coverage}% · 未知 ${Number(cache.unknown || 0)}${equipment ? " · 装备数据不完整，橙武/紫武统计暂不展示" : ""}`;
        }

        function renderRangeCard(rangeKey, rangeLabel, stats, outerTab) {
            const healer = stats.healer || {};
            const dps = stats.dps || {};
            const minScore = healer.min_score ?? dps.min_score ?? "-";
            const healerList = healer.list || [];
            const dpsList = dps.list || [];
            const healerLegendaryCountMap = healer.legendary_count_map || {};
            const dpsLegendaryCountMap = dps.legendary_count_map || {};
            const titleSuffix = outerTab === "purple" ? "（紫武）" : "";
            const rankingLabel = getOuterTabLabel(outerTab);
            const showMeta = ["前1000", "前200", "前100", "前50"].includes(rangeLabel);
            const seasonText = window.currentSeasonLabel || "-";

            return `
                <div class="range-card">
                    <div class="range-title">
                        <div class="range-heading">
                            <h3>${escapeHtml(rankingLabel)} · ${rangeLabel} 心法分布${titleSuffix}</h3>
                            <span>最低分数：${minScore}</span>
                        </div>
                        <button class="export-btn" type="button" data-range="${rangeLabel}" aria-label="分享统计图片">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M14 3a1 1 0 0 0 0 2h3.59l-6.3 6.3a1 1 0 1 0 1.42 1.4L19 6.41V10a1 1 0 1 0 2 0V4a1 1 0 0 0-1-1h-6z"></path>
                                <path d="M5 7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-4a1 1 0 1 0-2 0v4H5V9h4a1 1 0 1 0 0-2H5z"></path>
                            </svg>
                        </button>
                    </div>
                    ${showMeta ? `<div class="range-meta">赛季：${escapeHtml(seasonText)}</div>` : ""}
                    <div class="range-meta">${escapeHtml(renderKungfuCoverage(stats))}</div>
                    <div class="lane">
                        <div class="lane-title">奶妈（${healer.valid_count ?? 0}）</div>
                        ${healerList.length ? renderList(rangeKey, "healer", healerList, healer.valid_count || 0, healerLegendaryCountMap, showLegendaryOverlay && !hasIncompleteEquipment(healer)) : "<div class='muted'>暂无奶妈数据</div>"}
                    </div>
                    <div class="lane">
                        <div class="lane-title">DPS（${dps.valid_count ?? 0}）</div>
                        ${dpsList.length ? renderList(rangeKey, "dps", dpsList, dps.valid_count || 0, dpsLegendaryCountMap, showLegendaryOverlay && !hasIncompleteEquipment(dps)) : "<div class='muted'>暂无DPS数据</div>"}
                    </div>
                </div>
            `;
        }

        function buildFilteredLane(lane, mode) {
            if (mode === "purple" && hasIncompleteEquipment(lane)) {
                return {...lane, list: [], valid_count: 0, distribution: {}, legendary_count_map: {}};
            }
            const sourceList = lane.list || [];
            const sourceLegendaryCountMap = lane.legendary_count_map || {};
            const listItems = [];
            let validCount = 0;
            const filteredLegendaryCountMap = {};

            sourceList.forEach(([kungfu, count]) => {
                const legendaryCount = Number(sourceLegendaryCountMap[kungfu] || 0);
                const filteredCount = mode === "purple"
                    ? Math.max(Number(count || 0) - legendaryCount, 0)
                    : Number(count || 0);
                if (filteredCount > 0) {
                    listItems.push([kungfu, filteredCount]);
                    filteredLegendaryCountMap[kungfu] = mode === "purple" ? 0 : legendaryCount;
                }
                validCount += filteredCount;
            });

            listItems.sort((a, b) => b[1] - a[1]);

            return {
                ...lane,
                valid_count: validCount,
                list: listItems,
                distribution: Object.fromEntries(listItems),
                min_score: lane.min_score,
                legendary_count_map: filteredLegendaryCountMap,
            };
        }

        function buildFilteredStats(stats, mode) {
            const result = {};
            Object.keys(stats || {}).forEach((rangeKey) => {
                const rangeStats = stats[rangeKey] || {};
                if (!rangeStats.healer || !rangeStats.dps) {
                    result[rangeKey] = rangeStats;
                    return;
                }
                result[rangeKey] = {
                    ...rangeStats,
                    healer: buildFilteredLane(rangeStats.healer, mode),
                    dps: buildFilteredLane(rangeStats.dps, mode),
                };
            });
            return result;
        }

        function getRankingItemName(item) {
            return item.name || normalizeDetailPlayerName(item.role_name, item.server) || "未知";
        }

        function isPeakTab(tab) {
            return tab === "peak-game";
        }

        function getOuterTabLabel(tab) {
            const labelMap = {
                all: "推栏排名",
                purple: "推栏排名-紫武",
                "peak-game": "14日游戏最高分排名",
            };
            return labelMap[tab] || tab;
        }

        function getRankingScopeText(tab, peakPayload = null) {
            if (tab === "purple") {
                return "统计口径：基于当前排名快照中的推栏竞技场排名数据，剔除被判定为橙武/紫武影响口径的角色后，按心法统计分布并展示排名列表。";
            }
            if (tab === "peak-game") {
                const scope = peakPayload || peakScopeByTimestamp.get(String(currentStatsTimestamp));
                if (scope?.aggregation_scope === PEAK_SCOPE_CACHE_KEY) {
                    const windowText = `实际窗口：${formatTime(scope.window_start)} 至 ${formatTime(scope.window_end)}。`;
                    return `统计口径：以所选排名快照时间为锚点，回溯前 14 天本地已收录的 3v3 对局，最多至所选赛季开赛时间；不足 14 天按实际天数统计。按角色在对局中的游戏内分数取个人最高分排名。${windowText}可能因对局同步缺失导致数据不完整。`;
                }
                return "统计口径：以当前排名快照时间为锚点，回溯前 14 天本地已收录的 3v3 对局，按角色在对局中的游戏内分数取个人最高分排名；可能因对局同步缺失导致数据不完整。";
            }
            return "统计口径：基于当前排名快照中的推栏竞技场排名数据，按推栏当前分数统计全部角色的心法分布和排名列表。";
        }

        function syncScopeInlineText() {
            if (!scopeInlineNode) {
                return;
            }
            const text = getRankingScopeText(currentOuterTab);
            scopeInlineNode.innerHTML = `<strong>统计口径：</strong>${escapeHtml(text.replace(/^统计口径：/, ""))}`;
        }

        function resolveKungfuIconId(playerOrName) {
            if (playerOrName && typeof playerOrName === "object") {
                // Legacy ranking snapshots may contain swapped Tangmen or Fenshan/Xiaochen IDs.
                const name = String(playerOrName.kungfu || playerOrName.kungfu_name || "").trim();
                if (["天罗诡道", "惊羽诀", "分山劲", "笑尘诀"].includes(name)) return kungfuIconIdByName[name];
                const directId = playerOrName.kungfu_id || playerOrName.kungfuId;
                if (directId !== undefined && directId !== null && String(directId).trim()) {
                    return String(directId).trim();
                }
                return kungfuIconIdByName[name] || "";
            }
            const name = String(playerOrName || "").trim();
            return kungfuIconIdByName[name] || "";
        }

        function resolveRankingKungfuIconId(member) {
            // Classification fallback uses the corrected catalog. Legacy snapshots
            // with match equipment/team predate self_kungfu_id and retain their match ID.
            const source = member?.kungfu_source || member?.kungfu_selected_source;
            const derived = source === "direct_legacy" || (["indicator", "match_history"].includes(source)
                && Number.isInteger(member?.kungfu_publish_version) && member.kungfu_publish_version > 0);
            const legacyMatch = !member?.kungfu_acquisition && !derived
                && (member?.weapon_icon || member?.teammates?.length);
            const directId = member?.kungfu_id || member?.kungfuId;
            if (legacyMatch && directId !== undefined && directId !== null && String(directId).trim()) {
                return String(directId).trim();
            }
            const name = String(member?.kungfu || member?.kungfu_name || "").trim();
            return kungfuIconIdByName[name] || resolveKungfuIconId(member);
        }

        function renderTeamKungfuIconsInline(players) {
            if (!Array.isArray(players) || !players.length) {
                return "";
            }
            const icons = players
                .map((player) => {
                    const iconId = resolveKungfuIconId(player);
                    if (!iconId) {
                        return "";
                    }
                    return `
                    <span class="team-kungfu-icon" title="${escapeHtml(player.role_name || player.person_name || player.kungfu || "")}">
                        <img src="https://img.jx3box.com/image/xf/${escapeHtml(iconId)}.png" alt="${escapeHtml(player.kungfu || "kungfu")}">
                    </span>
                `;
                })
                .filter(Boolean);
            if (!icons.length) {
                return "";
            }
            return `<span class="match-icon-cluster">${icons.join("")}</span>`;
        }

        function normalizePlayerNameForCompare(name, server) {
            return normalizeDetailPlayerName(name, server || "").trim();
        }


        function findDisplaySelfPlayer(players, name, server) {
            // This only selects a display row. It never changes a request name or identity.
            const targetName = String(name || "").trim();
            const targetServer = String(server || "").trim();
            if (!targetName || !targetServer) return null;
            const candidates = (players || []).filter(player => player
                && String(player.server || "").trim() === targetServer);
            const exact = candidates.find(player => String(player.role_name || "").trim() === targetName);
            if (exact) return exact;
            const labels = new Set([`${targetName}·${targetServer}`, `${targetName}@${targetServer}`]);
            const displayed = candidates.filter(player => labels.has(String(player.role_name || "").trim()));
            return displayed.length === 1 ? displayed[0] : null;
        }

        function findPeakSelfPlayer(summary, name, server) {
            if (!summary || typeof summary !== "object") return null;
            const candidates = ["team1", "team2"].flatMap(teamKey => {
                const players = Array.isArray(summary[teamKey]?.players) ? summary[teamKey].players : [];
                return players.map(player => ({player, teamKey}));
            });
            const self = findDisplaySelfPlayer(candidates.map(item => item.player), name, server);
            return candidates.find(item => item.player === self) || null;
        }

        function resolveRankingItemKungfuIconId(item, name, server) {
            const self = findPeakSelfPlayer(item && item.cached_detail_summary, name, server);
            if (self && self.player) {
                const selfIconId = resolveKungfuIconId(self.player);
                if (selfIconId) {
                    return selfIconId;
                }
            }
            const directId = resolveKungfuIconId(item);
            if (directId) {
                return directId;
            }
            return resolveKungfuIconId(item && item.kungfu);
        }

        function renderPeakMatchSummary(summary, name, server) {
            if (!summary || typeof summary !== "object") {
                return `<span class="muted">等待对局摘要</span>`;
            }
            const team1 = summary.team1 && Array.isArray(summary.team1.players) ? summary.team1.players : [];
            const team2 = summary.team2 && Array.isArray(summary.team2.players) ? summary.team2.players : [];
            const self = findPeakSelfPlayer(summary, name, server);
            const selfTeam = self && self.teamKey === "team2" ? team2 : self && self.teamKey === "team1" ? team1 : [];
            const teamIcons = renderTeamKungfuIconsInline(selfTeam);
            if (!teamIcons) {
                return `<span class="muted">暂无对局图标</span>`;
            }
            return `
                <div class="peak-match-icons">
                    <span class="peak-match-team">${teamIcons}</span>
                </div>
            `;
        }

        function renderPeakMatchButton(item, name, server) {
            const matchId = item && item.match_id;
            if (!matchId) {
                return renderPeakMatchSummary(item && item.cached_detail_summary, name, server);
            }
            const summary = item.cached_detail_summary;
            const self = findPeakSelfPlayer(summary, name, server);
            const team1 = summary && summary.team1 && Array.isArray(summary.team1.players) ? summary.team1.players : [];
            const team2 = summary && summary.team2 && Array.isArray(summary.team2.players) ? summary.team2.players : [];
            const selfTeam = self && self.teamKey === "team2" ? team2 : self && self.teamKey === "team1" ? team1 : [];
            const teamIcons = renderTeamKungfuIconsInline(selfTeam);
            const matchTime = formatTime(item.match_time || item.start_time || item.matchTime);
            return `
                <button
                    class="ranking-match-btn"
                    type="button"
                    data-match-id="${escapeHtml(matchId)}"
                    data-focus-name="${escapeHtml(name)}"
                    data-focus-server="${escapeHtml(server)}"
                    title="查看对局详情"
                >
                    <span class="ranking-match-time">${escapeHtml(matchTime)}</span>
                    ${teamIcons ? `<span class="ranking-match-team-icons">${teamIcons}</span>` : "<span class='muted'>暂无对局图标</span>"}
                </button>
            `;
        }

        function getListSourceConfig(tab) {
            if (tab === "peak-game") {
                return { api: "peak-score", scoreType: "game", title: "14日游戏最高分排名" };
            }
            return { api: "flat-members", scoreType: null, title: tab === "purple" ? "推栏排名-紫武列表" : "推栏排名列表" };
        }

        function renderDistributionView(statsPayload, outerTab) {
            if (isPeakTab(outerTab)) {
                syncScopeInlineText();
            }
            const stats = equipmentViewState?.current && !isPeakTab(outerTab)
                ? equipmentAPI.equipmentStatistics(equipmentViewState.current, outerTab)
                : outerTab === "purple" ? buildFilteredStats(statsPayload.kungfu_statistics || {}, "purple")
                : (statsPayload.kungfu_statistics || {});
            const cards = rangeConfigs
                .filter((config) => stats[config.key])
                .map((config) => renderRangeCard(config.key, config.label, stats[config.key], outerTab));
            grid.innerHTML = cards.length ? cards.join("") : "<div class='range-card'>暂无统计数据</div>";
        }

        async function getPeakDistributionStats(timestamp) {
            const cacheKey = ["peak-game", PEAK_SCOPE_CACHE_KEY, timestamp, "distribution"].join("::");
            if (rankingListCache.has(cacheKey)) {
                return rankingListCache.get(cacheKey);
            }
            const results = await Promise.all(rangeConfigs.map(async (config) => {
                const response = await fetch(
                    buildPeakScoreUrl(timestamp, "game", config.key, { includeMatchSummary: false }),
                    { cache: "no-store" }
                );
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = unwrapResponse(await response.json());
                return [config.key, data];
            }));
            const firstResult = results[0]?.[1] || {};
            const payload = {
                aggregation_scope: firstResult.aggregation_scope,
                window_start: firstResult.window_start,
                window_end: firstResult.window_end,
                kungfu_statistics: Object.fromEntries(results.map(([key, data]) => [key, data.kungfu_statistics || {}])),
            };
            peakScopeByTimestamp.set(String(timestamp), payload);
            rankingListCache.set(cacheKey, payload);
            return payload;
        }

        async function loadPeakDistributionView() {
            if (!currentStatsTimestamp) {
                grid.innerHTML = "<div class='range-card'>缺少统计时间</div>";
                return;
            }
            const cacheKey = ["peak-game", PEAK_SCOPE_CACHE_KEY, currentStatsTimestamp, "distribution"].join("::");
            if (rankingListCache.has(cacheKey)) {
                renderDistributionView(rankingListCache.get(cacheKey), "peak-game");
                return;
            }
            grid.innerHTML = "<div class='range-card'>正在加载14日最高分心法分布...</div>";
            try {
                const payload = await getPeakDistributionStats(currentStatsTimestamp);
                renderDistributionView(payload, "peak-game");
                setStatus("14日最高分心法分布加载完成");
            } catch (error) {
                grid.innerHTML = `<div class='range-card muted error'>加载14日最高分心法分布失败：${escapeHtml(error.message || error)}</div>`;
            }
        }

        function renderListView(payload, outerTab, rangeKey) {
            if (isPeakTab(outerTab)) {
                peakScopeByTimestamp.set(String(payload.anchor_timestamp ?? currentStatsTimestamp), payload);
                syncScopeInlineText();
            }
            const range = currentStats?.kungfu_statistics?.[rangeKey];
            if (outerTab === "purple" && hasIncompleteEquipment(range?.healer, range?.dps)) {
                renderIncompleteEquipmentNotice();
                return;
            }
            const items = Array.isArray(payload.items) ? payload.items : [];
            const isPeak = isPeakTab(outerTab);
            if (!isPeak) rememberRankingDisplayMembers(items);
            const rangeLabel = (rangeConfigs.find((item) => item.key === rangeKey) || {}).label || rangeKey;
            const titleLabel = getOuterTabLabel(outerTab);
            const metaParts = [];
            if (isPeak) {
                metaParts.push(`窗口：${formatTime(payload.window_start)} 至 ${formatTime(payload.window_end)}`);
            } else {
                metaParts.push(`榜单时间：${formatTime(Number(currentStatsTimestamp))}`);
            }
            metaParts.push(`展示条数：${payload.total ?? payload.item_count ?? items.length}`);
            const rows = items.map((item) => {
                const name = getRankingItemName(item);
                const server = item.server || "未知";
                const kungfu = item.kungfu || "未知心法";
                const score = item.score ?? "-";
                const nameDisplay = `${name}·${server}`;
                const kungfuIconId = resolveRankingItemKungfuIconId(item, name, server);
                const kungfuIcon = kungfuIconId
                    ? `<img class="ranking-kungfu-icon" src="https://img.jx3box.com/image/xf/${escapeHtml(kungfuIconId)}.png" alt="${escapeHtml(kungfu)}">`
                    : "";
                const matchSummary = isPeak
                    ? renderPeakMatchButton(item, name, server)
                    : `<span class="muted">当前榜单</span>`;
                return `
                    <div class="ranking-row ranking-row-list">
                        <span>#${escapeHtml(item.rank ?? "-")}</span>
                        <span>
                            <button
                                class="ranking-name-btn ranking-list-role-btn"
                                type="button"
                                data-role-server="${escapeHtml(server)}"
                                data-role-name="${escapeHtml(name)}"
                                data-game-role-id="${escapeHtml(item.game_role_id ?? "")}"
                                data-global-role-id="${escapeHtml(item.global_role_id ?? "")}"
                                data-global-id="${escapeHtml(item.global_id ?? "")}"
                                data-role-id="${escapeHtml(item.role_id ?? "")}"
                                data-zone="${escapeHtml(item.zone ?? "")}"
                            >${escapeHtml(nameDisplay)}</button>
                        </span>
                        <span class="ranking-kungfu-cell">${kungfuIcon}${escapeHtml(kungfu)}</span>
                        <span class="ranking-score">${escapeHtml(score)}</span>
                        <span>${matchSummary}${!isPeak ? `<span class="ranking-display" data-display-rank="${escapeHtml(item.rank ?? "")}">${renderRankingDisplay(item, rankingDisplayRecords().get(item.rank))}</span>` : ""}</span>
                    </div>
                `;
            }).join("");

            grid.innerHTML = `
                <div class="ranking-list-card">
                    <div class="ranking-list-toolbar">
                        <div>
                            <h3>${escapeHtml(titleLabel)} · ${escapeHtml(rangeLabel)}</h3>
                            <div class="muted">${metaParts.map(escapeHtml).join(" ｜ ")}</div>
                        </div>
                    </div>
                    <div class="ranking-table">
                        <div class="ranking-row header">
                            <span>名次</span>
                            <span>角色</span>
                            <span>心法</span>
                            <span>分数</span>
                            <span>${isPeak ? "最高分对局" : "来源"}</span>
                        </div>
                        ${rows || "<div class='muted'>暂无列表数据</div>"}
                    </div>
                </div>
            `;
            if (!isPeak) activateRankingDisplays();
        }

        function renderIncompleteEquipmentNotice() {
            grid.innerHTML = "<div class='range-card muted'>装备数据不完整，紫武排名列表暂不展示</div>";
        }

        async function loadRankingListView(outerTab, rangeKey) {
            if (equipmentViewState?.current && !isPeakTab(outerTab)) {
                const items = equipmentAPI.visibleMembers(equipmentViewState.current, rangeKey, outerTab);
                renderListView({items, total: items.length}, outerTab, rangeKey); return;
            }
            const range = currentStats?.kungfu_statistics?.[rangeKey];
            if (outerTab === "purple" && hasIncompleteEquipment(range?.healer, range?.dps)) {
                renderIncompleteEquipmentNotice();
                return;
            }
            if (!currentStatsTimestamp) {
                grid.innerHTML = "<div class='range-card'>缺少统计时间</div>";
                return;
            }
            const sourceConfig = getListSourceConfig(outerTab);
            const anchor = currentStatsTimestamp;
            const view = currentInnerView;
            const url = sourceConfig.api === "flat-members"
                ? buildFlatMembersUrl(currentStatsTimestamp, rangeKey)
                : buildPeakScoreUrl(currentStatsTimestamp, sourceConfig.scoreType, rangeKey);
            const cacheKey = [outerTab, isPeakTab(outerTab) ? PEAK_SCOPE_CACHE_KEY : "ranking", currentStatsTimestamp, rangeKey].join("::");
            if (rankingListCache.has(cacheKey)) {
                renderListView(rankingListCache.get(cacheKey), outerTab, rangeKey);
                return;
            }
            grid.innerHTML = "<div class='range-card'>正在加载列表...</div>";
            try {
                const response = await fetch(url, { cache: "no-store" });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const payload = await response.json();
                const data = unwrapResponse(payload);
                rankingListCache.set(cacheKey, data);
                if (currentStatsTimestamp !== anchor || currentOuterTab !== outerTab || currentInnerView !== view) return;
                renderListView(data, outerTab, rangeKey);
                setStatus("列表加载完成");
            } catch (error) {
                if (currentStatsTimestamp !== anchor || currentOuterTab !== outerTab || currentInnerView !== view) return;
                grid.innerHTML = `<div class='range-card muted error'>加载列表失败：${escapeHtml(error.message || error)}</div>`;
            }
        }

        function syncOuterTabUI() {
            tabContainer.querySelectorAll(".tab-btn").forEach((btn) => {
                btn.classList.toggle("active", btn.dataset.tab === currentOuterTab);
            });
        }

        function syncInnerViewUI() {
            innerTabContainer.querySelectorAll(".tab-btn").forEach((btn) => {
                btn.classList.toggle("active", btn.dataset.view === currentInnerView);
            });
        }

        function renderCurrentView() {
            suspendRankingDisplays();
            if (!equipmentCommitting) queueMicrotask(() => activateRankingDisplays());
            syncOuterTabUI();
            syncInnerViewUI();
            syncScopeInlineText();
            if (toggleContainer) {
                toggleContainer.classList.toggle("hidden", currentInnerView !== "distribution");
            }

            if (!isPeakTab(currentOuterTab) && equipmentViewState?.manifest && !equipmentViewState.current) {
                showEquipmentPending(equipmentViewState.failed ? "完整装备数据读取失败，稍后重试" : "正在读取完整装备数据...",
                    equipmentViewState.failed);
                return;
            }
            if (currentInnerView === "distribution") {
                if (isPeakTab(currentOuterTab)) {
                    loadPeakDistributionView();
                    return;
                }
                if (currentStats) {
                    renderDistributionView(currentStats, currentOuterTab);
                }
                return;
            }

            loadRankingListView(currentOuterTab, currentListRange);
        }

        function setOuterTab(tab) {
            currentOuterTab = tab || "all";
            if (isPeakTab(currentOuterTab)) {
                currentInnerView = "distribution";
            }
            renderCurrentView();
        }

        function setInnerView(view) {
            currentInnerView = view || "distribution";
            renderCurrentView();
        }

        function render(data) {
            const seasonLabel = data.current_season ? `${data.current_season}${data.week_info || ""}` : (data.week_info || "-");
            window.currentSeasonLabel = seasonLabel || "-";
            window.currentRankingTimeLabel = formatTime(data.ranking_cache_time || data.generated_at);
            subtitle.innerHTML = `
                <span>赛季：${escapeHtml(seasonLabel || "-")}</span>
                <span>榜单时间：${formatTime(data.ranking_cache_time || data.generated_at)}</span>
            `;

            currentStats = data;
            renderCurrentView();

            if (!grid.innerHTML) {
                grid.innerHTML = "<div class='range-card'>暂无统计数据</div>";
            }
        }

        function buildReadUrl(timestamp) {
            const hasQuery = readApiBase.includes("?");
            const joiner = hasQuery ? "&" : "?";
            return `${readApiBase}${joiner}timestamp=${encodeURIComponent(timestamp)}&equipment_contract=2`;
        }

        function buildSeasonHistoryUrl(season) {
            const url = new URL(seasonHistoryApiBase, window.location.origin);
            url.searchParams.set("action", "season-history");
            url.searchParams.set("season", season);
            return url.toString();
        }

        async function loadStats(timestamp) {
            if (!timestamp) {
                setStatus("缺少 timestamp 参数，无法读取统计数据", "error");
                return;
            }
            const requestId = ++statsRequestId;
            pauseEquipmentBootstrapReload(true);
            suspendRankingDisplays();
            rankingDisplayMembers.clear();
            rankingDisplaySnapshots.clear();
            currentStats = null;
            equipmentViewState = null; equipmentFrozenPayload = null; equipmentStopped = false;
            currentStatsTimestamp = String(timestamp);
            showEquipmentPending("正在读取完整排行榜资料...");
            setStatus(`请求接口：${buildReadUrl(timestamp)}`);
            try {
                const response = await fetch(buildReadUrl(timestamp), { cache: "no-store" });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const payload = await response.json();
                if (requestId !== statsRequestId) {
                    return;
                }
                const data = unwrapResponse(payload);
                adoptEquipmentBootstrap(data);
            } catch (error) {
                if (requestId === statsRequestId) {
                    setStatus(`获取统计失败：${error.message || error}`, "error");
                }
            }
        }

        async function loadSeasonHistory(season) {
            pauseEquipmentBootstrapReload(true);
            suspendRankingDisplays();
            const retainedAnchor = currentStatsTimestamp;
            const requestId = ++seasonHistoryRequestId;
            ++statsRequestId;
            setSeasonHistoryLoading();
            setStatus(`正在加载${season}赛季历史快照...`);
            try {
                const response = await fetch(buildSeasonHistoryUrl(season), { cache: "no-store" });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = unwrapResponse(await response.json());
                if (requestId !== seasonHistoryRequestId) {
                    return;
                }
                if (!data || data.season !== season || !Array.isArray(data.items)) {
                    throw new Error("赛季历史数据格式异常");
                }
                renderMetadataList(data.items, availableSeasons, season);
                setStatus("数据加载完成");
            } catch (error) {
                if (requestId === seasonHistoryRequestId) {
                    restoreLoadedSeasonControls();
                    setStatus(`获取赛季历史失败：${error.message || error}`, "error");
                }
            } finally {
                if (requestId === seasonHistoryRequestId && currentStats && currentStatsTimestamp === retainedAnchor) {
                    activateRankingDisplays();
                }
            }
        }

        async function loadDateList() {
            try {
                const response = await fetch(seasonsApiUrl, { cache: "no-store" });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const payload = await response.json();
                const data = unwrapResponse(payload);
                availableSeasons = data && Array.isArray(data.seasons) ? data.seasons : [];
                const defaultSeason = data && typeof data.default_season === "string"
                    ? data.default_season : "";
                if (!availableSeasons.length || !defaultSeason) {
                    listContainer.textContent = "暂无可用赛季快照数据";
                    return;
                }
                await loadSeasonHistory(defaultSeason);
            } catch (error) {
                listContainer.textContent = `获取赛季列表失败：${error.message || error}`;
                listContainer.classList.add("error");
            }
        }

        function renderCachedTeamIcons(cachedDetailSummary) {
            if (!cachedDetailSummary || typeof cachedDetailSummary !== "object") {
                return "";
            }
            var team1 = cachedDetailSummary.team1 && Array.isArray(cachedDetailSummary.team1.players)
                ? cachedDetailSummary.team1.players
                : [];
            var team2 = cachedDetailSummary.team2 && Array.isArray(cachedDetailSummary.team2.players)
                ? cachedDetailSummary.team2.players
                : [];

            function renderIcons(players) {
                return players
                    .map(function (p) {
                        var iconId = resolveKungfuIconId(p);
                        if (!iconId) {
                            return "";
                        }
                        return "<span class=\"match-kungfu-icon\" title=\"" + escapeHtml(p.role_name || p.kungfu || "") + "\"><img src=\"https://img.jx3box.com/image/xf/" + escapeHtml(iconId) + ".png\" alt=\"" + escapeHtml(p.kungfu || "kungfu") + "\"></span>";
                    })
                    .filter(Boolean)
                    .join("");
            }

            var team1Icons = renderIcons(team1);
            var team2Icons = renderIcons(team2);

            if (!team1Icons && !team2Icons) {
                return "";
            }

            return "<div class=\"match-icons-row\"><div class=\"match-team-icons\">" + (team1Icons || "") + "</div><span class=\"match-vs\">vs</span><div class=\"match-team-icons\">" + (team2Icons || "") + "</div></div>";
        }

        function renderRoleRecentMatchItem(match, playerName, playerServer) {
            var cachedIconsHtml = renderCachedTeamIcons(match.cached_detail_summary);
            return `
                <button
                    class="match-row-btn ${match.won ? "win" : "lose"}"
                    type="button"
                    data-match-id="${match.match_id ?? ""}"
                    data-focus-name="${escapeHtml(playerName)}"
                    data-focus-server="${escapeHtml(playerServer)}"
                >
                    <div class="match-row-top">
                        <span class="match-tag ${match.won ? "win" : "lose"}">${match.won ? "胜利" : "失败"}</span>
                        <span>${formatGrade(match.avg_grade)}</span>
                        <span>${escapeHtml(match.kungfu || "未知心法")}</span>
                        <span>${match.total_mmr ?? "-"}${match.mmr_delta != null ? ` (${match.mmr_delta > 0 ? "+" : ""}${match.mmr_delta})` : ""}</span>
                    </div>
                    <div class="match-row-bottom match-row-meta">
                        <span>开始时间：${formatTime(match.start_time)}</span>
                        <span>时长：${formatDuration(match.duration)}</span>
                    </div>
                    ${cachedIconsHtml}
                </button>

        function renderLoadMoreButton() {
            if (!currentPagination.hasMore) {
                return "<div class='load-more-wrap hidden'></div>";
            }
            const disabledAttr = currentPagination.isLoading ? " disabled" : "";
            const loadingClass = currentPagination.isLoading ? " loading" : "";
            return `
                <div class="load-more-wrap">
                    <button class="load-more-btn${loadingClass}" type="button" id="load-more-btn"${disabledAttr}>
                        ${currentPagination.isLoading ? "加载中..." : "加载更多对局"}
                    </button>
                </div>
            `;
        }

        function renderRoleRecentModal(data, isAppend = false, indicatorData = null) {
            const matches = Array.isArray(data.recent_matches) ? data.recent_matches : [];
            const pagination = data.pagination || {};
            const playerName = data.player?.name || "未知角色";
            const playerServer = data.player?.server || "未知服务器";

            roleModalTitle.textContent = `${playerName}·${playerServer}`;
            roleModalSubtitle.textContent = "";

            currentPagination = {
                hasMore: !!pagination.has_more,
                nextCursor: pagination.next_cursor ?? null,
                server: playerServer,
                name: playerName,
                identityHints: data.identity || {},
                isLoading: false,
            };

            if (isAppend) {
                const panel = roleModalBody.querySelector(".match-list-panel");
                if (panel) {
                    const modalEmpty = panel.querySelector(".modal-empty");
                    if (modalEmpty) modalEmpty.remove();
                    const loadMoreWrap = panel.querySelector(".load-more-wrap");
                    const fragment = document.createElement("div");
                    fragment.innerHTML = matches.map((match) => renderRoleRecentMatchItem(match, playerName, playerServer)).join("");
                    if (loadMoreWrap) {
                        loadMoreWrap.insertAdjacentElement("beforebegin", fragment);
                        loadMoreWrap.outerHTML = renderLoadMoreButton();
                    } else {
                        panel.insertAdjacentHTML("beforeend", fragment.innerHTML);
                        panel.insertAdjacentHTML("beforeend", renderLoadMoreButton());
                    }
                }
                return;
            }

            let overviewHtml = "";
            if (indicatorData && !indicatorData.error) {
                const ind = indicatorData.indicator || {};
                const indicatorCards = [
                    { label: "场次", value: ind.total_matches ?? "-" },
                    { label: "胜率", value: ind.win_rate != null ? `${ind.win_rate}%` : "-" },
                    { label: "评分", value: ind.score ?? "-" },
                    { label: "最佳", value: ind.mvp_count ?? "-" },
                    { label: "当前段位", value: formatGrade(ind.grade) },
                ];
                overviewHtml = indicatorCards.map((item) => `
                    <div class="role-overview-card">
                        <strong>${escapeHtml(item.value)}</strong>
                        <span>${escapeHtml(item.label)}</span>
                    </div>
                `).join("");
            } else if (indicatorData && indicatorData.error) {
                overviewHtml = `<div class="role-overview-card" style="grid-column:1/-1"><strong class="muted">赛季战绩加载失败</strong><span>${escapeHtml(indicatorData.message || "indicator_unavailable")}</span></div>`;
            } else {
                overviewHtml = `<div class="role-overview-card" style="grid-column:1/-1"><strong class="muted">正在加载赛季战绩...</strong><span>等待战绩数据</span></div>`;
            }

            const hasMore = !!(pagination.has_more);
            const matchListHtml = matches.length
                ? matches.map((match) => renderRoleRecentMatchItem(match, playerName, playerServer)).join("")
                : (hasMore ? "" : "<div class='modal-empty'>暂无最近 3v3 对局数据</div>");

            roleModalBody.innerHTML = `
                <div class="role-overview-toolbar">
                    <span class="cache-label" id="role-indicator-cache-label">${renderIndicatorCacheLabel(indicatorData)}</span>
                    <button class="role-refresh-btn" id="refresh-role-indicator-btn" type="button">刷新战绩</button>
                </div>
                <div class="role-overview" id="role-overview">
                    ${overviewHtml}
                </div>
                <div class="match-list-toolbar">
                    <span class="match-list-title">近期对局</span>
                    <div class="match-list-actions">
                        <span class="cache-label" id="role-recent-cache-label">${renderRoleRecentCacheLabel(data)}</span>
                        <button class="match-refresh-btn" id="refresh-role-recent-btn" type="button">刷新对局</button>
                    </div>
                </div>
                <div class="match-list-panel">
                    ${matchListHtml}
                    ${renderLoadMoreButton()}
                </div>
            `;
        }

        function renderRoleRecentCacheLabel(data) {
            const cache = data && data.cache;
            if (!cache || !cache.cached_at) {
                return "对局列表：实时获取";
            }
            return `对局列表：${cache.hit ? "缓存于" : "刚更新于"} ${formatTime(cache.cached_at)}`;
        }


        function renderIndicatorCacheLabel(indicatorData) {
            const cache = indicatorData && indicatorData.cache;
            if (!cache || !cache.cached_at) return "";
            const originalTime = formatTime(cache.cached_at);
            if (cache.stale === true) return `赛季战绩：缓存于 ${originalTime}；刷新失败，使用旧数据`;
            return `赛季战绩：${cache.hit ? "缓存于" : "刚更新于"} ${originalTime}`;
        }

        function updateRoleOverviewIndicator(indicatorData) {
            const overview = document.getElementById("role-overview");
            if (!overview) {
                return;
            }
            const cacheLabel = document.getElementById("role-indicator-cache-label");
            if (cacheLabel) {
                cacheLabel.textContent = renderIndicatorCacheLabel(indicatorData);
            }
            if (indicatorData && !indicatorData.error) {
                const ind = indicatorData.indicator || {};
                const indicatorCards = [
                    { label: "场次", value: ind.total_matches ?? "-" },
                    { label: "胜率", value: ind.win_rate != null ? `${ind.win_rate}%` : "-" },
                    { label: "评分", value: ind.score ?? "-" },
                    { label: "最佳", value: ind.mvp_count ?? "-" },
                    { label: "当前段位", value: formatGrade(ind.grade) },

                overview.innerHTML = indicatorCards.map((item) => `
                    <div class="role-overview-card">
                        <strong>${escapeHtml(item.value)}</strong>
                        <span>${escapeHtml(item.label)}</span>
                    </div>

                overview.innerHTML = `<div class="role-overview-card" style="grid-column:1/-1"><strong class="muted">赛季战绩加载失败</strong><span>${escapeHtml(indicatorData.message || "indicator_unavailable")}</span></div>`;

        function renderIconGrid(items, emptyText) {
            if (!Array.isArray(items) || !items.length) {
                return `<div class="icon-grid"><div class="icon-chip empty">${escapeHtml(emptyText || "无")}</div></div>`;
            }
            const chips = items
                .filter((item) => item && item.icon)
                .map((item) => `
                    <div class="icon-chip${String(item.quality) === "5" ? " legendary" : ""}" title="${escapeHtml(item.name || "")}">
                        <img src="${escapeHtml(item.icon)}" alt="${escapeHtml(item.name || "icon")}">
                    </div>
                `);
            if (!chips.length) {
                return `<div class="icon-grid"><div class="icon-chip empty">${escapeHtml(emptyText || "无")}</div></div>`;
            }
            return `<div class="icon-grid">${chips.join("")}</div>`;
        }

        function renderTalentGrid(talents, emptyText) {
            if (!Array.isArray(talents) || !talents.length) {
                return `<div class="talent-grid"><div class="talent-chip empty-chip">${escapeHtml(emptyText || "无")}</div></div>`;
            }
            const chips = talents
                .filter((t) => t && t.name)
                .map((t) => {
                    const desc = t.desc || "";
                    const icon = t.icon || "";
                    const iconHtml = icon
                        ? `<div class="talent-chip-icon"><img src="${escapeHtml(icon)}" alt="${escapeHtml(t.name)}"></div>`
                        : `<div class="talent-chip-icon" style="display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:0.72rem;">-</div>`;
                    return `<span class="talent-chip" data-desc="${escapeHtml(desc)}">${iconHtml}<span class="talent-chip-name">${escapeHtml(t.name)}</span></span>`;
                });
            if (!chips.length) {
                return `<div class="talent-grid"><div class="talent-chip empty-chip">${escapeHtml(emptyText || "无")}</div></div>`;
            }
            return `<div class="talent-grid">${chips.join("")}</div>`;

        function cancelRoleRequests() {
            if (currentRoleInspect) currentRoleInspect.controller.abort();
            currentRoleInspect = null;
            currentPagination = {hasMore: false, nextCursor: null, server: "", name: "", identityHints: {}, isLoading: false};
        }

        function isCurrentRoleView(view) {
            return Boolean(view && currentRoleInspect === view && !view.controller.signal.aborted
                && roleModal.classList.contains("show"));
        }

        function roleQueryFailureMessage(error) {
            if (["query_timeout", "indicator_query_timeout"].includes(error?.message) || error?.name === "TimeoutError") return "请求超时，请稍后重试";
            if (["query_busy", "indicator_query_busy"].includes(error?.message)) return "查询繁忙，请稍后重试";
            if (error?.message === "indicator_storage_unavailable") return "查询失败：存储暂不可用，请稍后重试";
            if (error?.message === "indicator_unavailable") return "战绩获取失败，请稍后重试";
            return error?.message || "查询失败，请稍后重试";
        }

        async function fetchRoleQuery(url, view) {
            const controller = new AbortController();
            const abortView = () => controller.abort();
            if (!isCurrentRoleView(view)) throw new DOMException("View closed", "AbortError");
            view.controller.signal.addEventListener("abort", abortView, {once: true});
            let timedOut = false;
            const timer = window.setTimeout(() => { timedOut = true; controller.abort(); }, 11000);
            try {
                const response = await fetch(url, {cache: "no-store", signal: controller.signal});
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = unwrapResponse(await response.json());
                // Also reject a late fulfilled response from an already-aborted view.
                if (timedOut) throw new Error("query_timeout");
                if (!isCurrentRoleView(view)) throw new DOMException("View closed", "AbortError");
                return data;
            } catch (error) {
                if (timedOut) throw new Error("query_timeout");
                throw error;
            } finally {
                window.clearTimeout(timer);
                view.controller.signal.removeEventListener("abort", abortView);
            }
        }

        async function fetchRoleIndicator(server, name, identityHints, cacheKey, forceRefresh = false, view = currentRoleInspect) {
            if (!isCurrentRoleView(view)) return null;
            const generation = (view.indicatorGeneration || 0) + 1;
            view.indicatorGeneration = generation;
            const isCurrentRequest = () => isCurrentRoleView(view) && view.indicatorGeneration === generation;
            try {
                const data = await fetchRoleQuery(buildRoleIndicatorUrl(server, name, identityHints, {forceRefresh}), view);
                if (!data || data.error || !data.indicator || typeof data.indicator !== "object" || Array.isArray(data.indicator)) {
                    throw new Error("战绩数据格式异常");
                }
                if (!isCurrentRequest()) return null;
                roleIndicatorCache.set(cacheKey, {fetchedAt: Date.now(), data});
                updateRoleOverviewIndicator(data);
                return data;
            } catch (error) {
                if (!isCurrentRequest()) return null;
                const data = {error: true, message: roleQueryFailureMessage(error)};
                if (!forceRefresh) updateRoleOverviewIndicator(data);
                return data;
            }
        }


        async function refreshRoleIndicator() {
            const view = currentRoleInspect;
            if (!isCurrentRoleView(view)) return;
            const button = document.getElementById("refresh-role-indicator-btn");
            if (button) {button.disabled = true; button.textContent = "刷新中...";}
            const previous = roleIndicatorCache.get(view.cacheKey)?.data || null;
            const request = fetchRoleIndicator(view.server, view.name, view.identityHints, view.cacheKey, true, view);
            const generation = view.indicatorGeneration;
            const isCurrentRequest = () => isCurrentRoleView(view) && view.indicatorGeneration === generation;
            try {
                const data = await request;
                if (!isCurrentRequest()) return;
                if (data?.error) {
                    if (previous && !previous.error) updateRoleOverviewIndicator(previous);
                    else updateRoleOverviewIndicator(data);
                    const label = document.getElementById("role-indicator-cache-label");
                    if (label) label.textContent = `刷新失败：${data.message}；${previous ? `保留${renderIndicatorCacheLabel(previous) || "现有数据"}` : "请稍后重试"}`;
                }
            } finally {
                if (isCurrentRequest() && button) {button.disabled = false; button.textContent = "刷新战绩";}
            }
        }


        async function fetchRoleRecent(server, name, identityHints, cacheKey, forceRefresh = false, view = currentRoleInspect) {
            const data = await fetchRoleQuery(buildRoleRecentUrl(server, name, identityHints, 0, {forceRefresh}), view);
            if (!data || data.error || !data.player || !Array.isArray(data.recent_matches)) throw new Error("对局数据格式异常");
            if (!isCurrentRoleView(view)) throw new DOMException("View closed", "AbortError");
            roleRecentCache.set(cacheKey, {fetchedAt: Date.now(), data});
            return data;
        }


        async function refreshRoleRecent() {
            const view = currentRoleInspect;
            if (!isCurrentRoleView(view)) return;

        async function loadRoleRecent(server, name, identityHints = {}) {
            cancelRoleRequests();
            const hints = {...identityHints};
            const cacheKey = JSON.stringify([server, name, ...["global_id", "global_role_id", "game_role_id", "role_id", "zone"].map(key => hints[key] || "")]);
            const view = {server, name, identityHints: hints, cacheKey, controller: new AbortController()};
            currentRoleInspect = view;
            openModal(roleModal);
            roleModalTitle.textContent = `${name}·${server}`;
            roleModalSubtitle.textContent = "";
            roleModalBody.innerHTML = "<div class='modal-loading'>正在加载角色近期战绩...</div>";
            const cached = roleRecentCache.get(cacheKey);
            if (cached && Date.now() - cached.fetchedAt < 600000) {
                const indicator = roleIndicatorCache.get(cacheKey);
                const validIndicator = indicator && Date.now() - indicator.fetchedAt < 86400000
                    && indicator.data.cache?.stale !== true ? indicator.data : null;
                renderRoleRecentModal(cached.data, false, validIndicator);
                if (!validIndicator) await fetchRoleIndicator(server, name, hints, cacheKey, false, view);
                return;
            }
            try {
                const [recentData, indicatorData] = await Promise.all([
                    fetchRoleRecent(server, name, hints, cacheKey, false, view),
                    fetchRoleIndicator(server, name, hints, cacheKey, false, view),
                ]);
                if (!isCurrentRoleView(view)) return;
                renderRoleRecentModal(recentData, false, indicatorData || {error: true, message: "战绩加载失败"});
            } catch (error) {
                if (!isCurrentRoleView(view)) return;
                roleModalBody.innerHTML = `<div class='modal-loading error'>加载角色近期战绩失败：${escapeHtml(roleQueryFailureMessage(error))}</div>`;
            }
        }


        async function loadMoreMatches() {
            const view = currentRoleInspect;
            const pagination = currentPagination;
            if (!isCurrentRoleView(view) || pagination.isLoading || !pagination.hasMore || pagination.nextCursor == null) return;
            pagination.isLoading = true;
            const button = roleModalBody.querySelector("#load-more-btn");
            if (button) {button.textContent = "加载中..."; button.classList.add("loading"); button.disabled = true;}
            try {
                const data = await fetchRoleQuery(buildRoleRecentUrl(pagination.server, pagination.name, pagination.identityHints, pagination.nextCursor), view);
                if (!data || data.error || !data.player || !Array.isArray(data.recent_matches)) throw new Error("对局数据格式异常");
                if (isCurrentRoleView(view) && currentPagination === pagination) renderRoleRecentModal(data, true);
            } catch (error) {
                if (isCurrentRoleView(view) && currentPagination === pagination && button) {
                    button.textContent = `加载失败：${roleQueryFailureMessage(error)}，点击重试`;
                    button.classList.remove("loading"); button.disabled = false;
                }
            } finally {
                pagination.isLoading = false;
            }
        }

                        '<span class="item-date">' + escapeHtml(item.date || "") + '</span>' +
                        '<span class="item-title">' + escapeHtml(item.title || "") + '</span>' +
                        '</div>' +
                        '<div class="item-body">' + escapeHtml(item.content || "") + '</div>';
                    container.insertBefore(div, sentinel);
                }

                if (!announcementHasMore && sentinel) {
                    sentinel.remove();
                }
            } catch (e) {
                if (loadingEl) loadingEl.textContent = "加载失败";
            } finally {
                announcementLoading = false;
                if (loadingEl && announcementHasMore) loadingEl.style.display = "none";
            }
        }

        function dismissAnnouncement() {
            if (currentPopupSeenAt) safeSetAnnouncementSeen(currentPopupSeenAt);
            currentPopupSeenAt = null;
            if (announcementObserver) announcementObserver.disconnect();
            closeModal(announcementModal);
        }

        if (announcementDismissBtn) {
            announcementDismissBtn.addEventListener("click", dismissAnnouncement);
        }

        // ---- Floating Feedback Circle ----
        (function () {
            const circle = document.getElementById("floating-feedback");
            const closeBtn = document.getElementById("floating-feedback-close");
            if (!circle) return;

            const HIDDEN_KEY = "feedback_circle_hidden";

            if (!sessionStorage.getItem(HIDDEN_KEY)) {
                circle.classList.remove("hidden");
            }

            let dragState = null;

            function setPos(left, top) {
                circle.style.left = left + "px";
                circle.style.top = top + "px";
                circle.style.right = "auto";
                circle.style.bottom = "auto";
            }

            circle.addEventListener("pointerdown", function (e) {
                if (e.target === closeBtn) return;
                const rect = circle.getBoundingClientRect();
                dragState = {
                    startX: e.clientX,
                    startY: e.clientY,
                    startLeft: rect.left,
                    startTop: rect.top
                };
                circle.setPointerCapture(e.pointerId);
                circle.classList.add("dragging");
            });

            circle.addEventListener("pointermove", function (e) {
                if (!dragState) return;
                setPos(
                    dragState.startLeft + e.clientX - dragState.startX,
                    dragState.startTop + e.clientY - dragState.startY
                );
            });

            circle.addEventListener("pointerup", function (e) {
                if (!dragState) return;
                const dx = e.clientX - dragState.startX;
                const dy = e.clientY - dragState.startY;
                const wasDrag = Math.abs(dx) > 3 || Math.abs(dy) > 3;
                dragState = null;
                circle.classList.remove("dragging");
                if (!wasDrag) {
                    openAnnouncementFromCircle();
                }
            });

            circle.addEventListener("pointercancel", function () {
                dragState = null;
                circle.classList.remove("dragging");
            });

            closeBtn.addEventListener("click", function (e) {
                e.stopPropagation();
                circle.classList.add("hidden");
                try { sessionStorage.setItem(HIDDEN_KEY, "1"); } catch (ignored) {}
            });
        })();

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") activateRankingDisplays();
            else suspendRankingDisplays();
        });
        window.addEventListener("pagehide", () => suspendRankingDisplays());
        window.addEventListener("pageshow", () => activateRankingDisplays());
        window.addEventListener("scroll", () => tickRankingDisplays(), {passive: true});
        window.addEventListener("resize", () => tickRankingDisplays(), {passive: true});
        grid.addEventListener("toggle", event => {
            if (!event.target.matches("details.detail")) return;
            if (equipmentViewState?.manifest && !isPeakTab(currentOuterTab)) {
                // V2 polling belongs to the complete board. Expanding/folding
                // only changes DOM, including toggle events restoring a commit.
                if (event.target.open) ensureDetailLoaded(event.target);
                return;
            }
            // Legacy per-card reads invalidate requests on a fold.
            suspendRankingDisplays();
            if (event.target.open) ensureDetailLoaded(event.target);
            else activateRankingDisplays();
        }, true);

        loadDateList();

        if (grid) {
            grid.addEventListener("click", (event) => {
                const target = event.target;
                if (!(target instanceof Element)) {
                    return;
                }

                const exportButton = target.closest(".export-btn");
                if (exportButton) {
                    const card = exportButton.closest(".range-card");
                    if (card) {
                        exportCardImage(card, exportButton.getAttribute("data-range") || "心法统计");
                    }
                    return;
                }

                const rankingMatchButton = target.closest(".ranking-match-btn");
                if (rankingMatchButton) {
                    const matchId = rankingMatchButton.getAttribute("data-match-id") || "";
                    if (matchId) {
                        loadMatchDetail(matchId, {
                            name: rankingMatchButton.getAttribute("data-focus-name") || "",
                            server: rankingMatchButton.getAttribute("data-focus-server") || "",
                        });
                    }
                    return;
                }

                const memberButton = target.closest(".detail-item-btn, .ranking-list-role-btn");
                if (memberButton) {
                    const server = memberButton.getAttribute("data-role-server") || "";
                    const name = memberButton.getAttribute("data-role-name") || "";
                    if (server && name) {
                        loadRoleRecent(server, name, {
                            game_role_id: memberButton.getAttribute("data-game-role-id") || "",
                            global_role_id: memberButton.getAttribute("data-global-role-id") || "",
                            global_id: memberButton.getAttribute("data-global-id") || "",
                            role_id: memberButton.getAttribute("data-role-id") || "",
                            zone: memberButton.getAttribute("data-zone") || "",
                        });
                    }
                    return;
                }

            });
        }

        roleModal.addEventListener("click", (event) => {
            const target = event.target;
            if (!(target instanceof HTMLElement)) {
                return;
            }
            if (target === roleModal || target.closest("[data-close-modal='role']")) {
                closeModal(roleModal);
                return;
            }
            const loadMoreBtn = target.closest("#load-more-btn");
            if (loadMoreBtn) {
                loadMoreMatches();
                return;
            }
            const refreshIndicatorBtn = target.closest("#refresh-role-indicator-btn");
            if (refreshIndicatorBtn) {
                refreshRoleIndicator();
                return;
            }
            const refreshRecentBtn = target.closest("#refresh-role-recent-btn");
            if (refreshRecentBtn) {
                refreshRoleRecent();
                return;
            }
            const matchButton = target.closest(".match-row-btn");
            if (!matchButton) {
                return;
            }
            const matchId = matchButton.getAttribute("data-match-id") || "";
            if (!matchId) {
                return;
            }
            const focusPlayer = {
                name: matchButton.getAttribute("data-focus-name") || currentRoleInspect?.name || "",
                server: matchButton.getAttribute("data-focus-server") || currentRoleInspect?.server || "",
            };
            loadMatchDetail(matchId, focusPlayer);
        });

        matchModal.addEventListener("click", (event) => {
            const target = event.target;
            if (!(target instanceof HTMLElement)) {
                return;
            }
            const playerCard = target.closest(".team-player[data-role-nav='1']");
            if (playerCard) {
                openSyncedMatchesForPlayer(
                    playerCard.getAttribute("data-player-server") || "",
                    playerCard.getAttribute("data-player-name") || "",
                );
                return;
            }
            if (target === matchModal || target.closest("[data-close-modal='match']")) {
                closeModal(matchModal);
            }
        });

        announcementModal.addEventListener("click", (event) => {
            const target = event.target;
            if (!(target instanceof HTMLElement)) {
                return;
            }
            if (target === announcementModal || target.closest("[data-close-modal='announcement']")) {
                dismissAnnouncement();
            }
        });

        document.addEventListener("keydown", (event) => {
            if (event.key !== "Escape") {
                return;
            }
            if (matchModal.classList.contains("show")) {
                closeModal(matchModal);
                return;
            }
            if (roleModal.classList.contains("show")) {
                closeModal(roleModal);
                return;
            }
            if (announcementModal.classList.contains("show")) {
                dismissAnnouncement();
            }
        });

        tabContainer.addEventListener("click", (event) => {
            const exportButton = event.target.closest(".tab-export-btn");
            if (exportButton) {
                exportFullPageImage(exportButton.dataset.exportMode || currentOuterTab);
                return;
            }
            const button = event.target.closest(".tab-btn");
            if (!button) {
                return;
            }
            setOuterTab(button.dataset.tab || "all");
        });

        innerTabContainer.addEventListener("click", (event) => {
            const button = event.target.closest(".tab-btn");
            if (!button) {
                return;
            }
            setInnerView(button.dataset.view || "distribution");
        });
    </script>
</body>
</html>
