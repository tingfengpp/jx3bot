<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJC 数据中心 · 心法排名统计</title>
    <style>
        :root {
            --bg: #f7fafd;
            --bg-accent: #e8f2ff;
            --ink: #2c3e50;
            --muted: #65748b;
            --card: #ffffff;
            --stroke: rgba(137, 196, 244, 0.22);
            --accent: #5b7cfa;
            --accent-2: #ff78b1;
            --shadow: 0 12px 32px rgba(94, 125, 245, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--ink);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background:
                radial-gradient(circle at 15% 10%, rgba(137, 196, 244, 0.18), transparent 55%),
                radial-gradient(circle at 85% 0%, rgba(255, 121, 176, 0.18), transparent 60%),
                linear-gradient(140deg, var(--bg), #ffffff);
            min-height: 100vh;
            padding: 36px 24px 60px;
        }

        .site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 18px;
            padding: 14px 18px;
            border: 1px solid var(--stroke);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.86);
            box-shadow: var(--shadow);
        }

        .site-brand {
            display: inline-flex;
            min-width: 0;
            flex-direction: column;
            gap: 2px;
            color: var(--ink);
            text-decoration: none;
        }

        .site-brand strong { letter-spacing: 1px; }
        .site-brand span { color: var(--muted); font-size: 0.78rem; }
        .site-nav { display: flex; gap: 6px; overflow-x: auto; padding: 2px; }
        .site-nav a {
            flex: 0 0 auto;
            padding: 8px 11px;
            border-radius: 10px;
            color: var(--muted);
            font-size: 0.86rem;
            text-decoration: none;
            white-space: nowrap;
        }
        .site-nav a:hover, .site-nav a[aria-current="page"] {
            color: var(--accent);
            background: rgba(91, 124, 250, 0.10);
        }
        .page-title-region { margin-bottom: 18px; }
        .page-title-region h1 { margin: 0; font-size: clamp(1.6rem, 2.6vw, 2.4rem); line-height: 1.25; letter-spacing: 0.08em; }

        .page::before {
            content: "";
            position: absolute;
            inset: -20px;
            background: repeating-linear-gradient(
                130deg,
                rgba(255, 255, 255, 0.55),
                rgba(255, 255, 255, 0.55) 1px,
                transparent 1px,
                transparent 18px
            );
            border-radius: 32px;
            z-index: -1;
        }

        header {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 24px 28px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: var(--shadow);
            border: 1px solid rgba(137, 196, 244, 0.22);
        }

        .title {
            font-weight: 700;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.98rem;
            display: flex;
            flex-wrap: wrap;
            gap: 10px 18px;
        }

        .announcement {
            border-radius: 14px;
            padding: 10px 14px;
            background: rgba(91, 124, 250, 0.08);
            border: 1px solid rgba(91, 124, 250, 0.22);
            color: #324a7d;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .meta {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        }

        .meta-card {
            border-radius: 16px;
            padding: 12px 14px;
            background: var(--card);
            border: 1px solid var(--stroke);
            font-size: 0.92rem;
            color: var(--muted);
        }

        .meta-card strong {
            display: block;
            color: var(--ink);
            font-size: 1.04rem;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .status {
            min-width: 0;
            max-width: 100%;
            overflow-wrap: anywhere;
            margin-top: 18px;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.9);
            border: 1px dashed rgba(94, 125, 245, 0.25);
            color: var(--muted);
        }

        .status.hidden {
            display: none;
        }

        .history-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 12px;
            align-items: flex-end;
        }

        .history-field {
            display: inline-flex;
            flex-direction: column;
            gap: 5px;
            min-width: 132px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
        }

        .history-field.snapshot-field {
            min-width: 0;
            max-width: 100%;
            flex: 1 1 280px;
        }

        .history-field select,
        .legacy-date-select {
            min-width: 0;
            max-width: 100%;
            min-height: 34px;
            border-radius: 10px;
            border: 1px solid rgba(137, 196, 244, 0.35);
            background: #ffffff;
            color: var(--ink);
            font-family: inherit;
            font-size: 0.9rem;
            padding: 6px 10px;
            outline: none;
        }

        .history-field select:focus,
        .legacy-date-select:focus {
            border-color: rgba(91, 124, 250, 0.65);
            box-shadow: 0 0 0 3px rgba(91, 124, 250, 0.12);
        }

        .tabs {
            margin-top: 18px;
            display: inline-flex;
            gap: 10px;
            padding: 6px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(137, 196, 244, 0.22);
            box-shadow: var(--shadow);
            flex-wrap: wrap;
        }

        .tab-group {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn {
            border: none;
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--muted);
            background: transparent;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            color: #ffffff;
            background: linear-gradient(120deg, var(--accent), var(--accent-2));
            box-shadow: 0 8px 20px rgba(91, 124, 250, 0.25);
        }

        .tab-export-btn {
            border: none;
            padding: 0;
            font-size: 0.76rem;
            font-weight: 600;
            color: var(--accent);
            background: transparent;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s ease, opacity 0.2s ease;
        }

        .tab-export-btn:hover {
            color: var(--accent-2);
        }

        .toggle-wrap {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(137, 196, 244, 0.22);
            box-shadow: var(--shadow);
            width: fit-content;
        }

        .toggle-wrap.hidden {
            display: none;
        }

        .toggle-wrap label {
            font-size: 0.88rem;
            color: var(--muted);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .toggle-wrap input[type="checkbox"] {
            width: 36px;
            height: 20px;
            appearance: none;
            background: rgba(91, 124, 250, 0.2);
            border-radius: 999px;
            position: relative;
            outline: none;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .toggle-wrap input[type="checkbox"]::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease;
        }

        .toggle-wrap input[type="checkbox"]:checked {
            background: linear-gradient(120deg, var(--accent), var(--accent-2));
        }

        .toggle-wrap input[type="checkbox"]:checked::after {
            transform: translateX(16px);
        }

        .grid {
            margin-top: 28px;
            display: grid;
            gap: 24px;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr));
        }

        .range-card {
            min-width: 0;
            background: var(--card);
            border-radius: 20px;
            padding: 18px 18px 22px;
            border: 1px solid var(--stroke);
            box-shadow: 0 10px 28px rgba(94, 125, 245, 0.12);
        }

        .range-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .range-heading {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 10px;
        }

        .range-title h3 {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        .range-title span {
            color: var(--muted);
            font-size: 0.85rem;
        }

        .range-meta {
            margin: 6px 0 4px;
            font-size: 0.86rem;
            color: var(--muted);
        }

        .export-btn {
            border: none;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--accent);
            background: rgba(91, 124, 250, 0.12);
            box-shadow: none;
            transition: transform 0.2s ease, background 0.2s ease;
            margin-left: auto;
        }

        .export-btn svg {
            width: 14px;
            height: 14px;
            display: block;
            fill: currentColor;
        }

        .export-btn:hover {
            transform: translateY(-1px);
            background: rgba(91, 124, 250, 0.18);
        }

        .range-card.is-exporting .export-btn {
            opacity: 0;
            pointer-events: none;
        }

        .range-card.is-exporting .detail-list {
            display: none;
        }

        .page.is-exporting-full .tab-export-btn,
        .page.is-exporting-full .export-btn {
            opacity: 0;
            pointer-events: none;
        }

        .page.is-exporting-full .detail-list {
            display: none;
        }

        .export-meta {
            font-size: 0.86rem;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .lane {
            margin-top: 12px;
        }

        .lane-title {
            font-size: 0.98rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .bar-row {
            display: grid;
            grid-template-columns: 96px 1fr 52px 60px;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }

        .bar {
            height: 16px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(91, 124, 250, 0.14), rgba(255, 120, 177, 0.18));
            position: relative;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            transition: width 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .bar-value {
            font-weight: 700;
            color: var(--ink);
            text-align: right;
        }

        .bar-percent {
            color: var(--muted);
            text-align: right;
            font-size: 0.84rem;
        }

        .bar-legendary {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(90deg, rgba(245, 197, 66, 0.9), rgba(245, 168, 66, 0.9));
            opacity: 0.85;
        }

        .bar-kungfu {
            font-weight: 700;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .arrow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 999px;
            font-size: 0.75rem;
            color: var(--accent);
            background: rgba(91, 124, 250, 0.12);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .detail[open] .arrow {
            transform: rotate(90deg);
            background: rgba(255, 120, 177, 0.15);
        }

        .detail {
            padding: 0;
            margin-bottom: 6px;
            transition: color 0.2s ease;
        }

        .detail summary {
            list-style: none;
            cursor: pointer;
        }

        .detail:hover {
            color: var(--ink);
        }

        .detail summary::-webkit-details-marker {
            display: none;
        }

        .detail-list {
            margin-top: 8px;
            padding-top: 4px;
            border-top: 1px solid rgba(137, 196, 244, 0.25);
            display: grid;
            gap: 4px;
            font-size: 0.88rem;
        }

        .detail-item {
            display: grid;
            grid-template-columns: 72px 1fr 70px;
            gap: 8px;
            align-items: center;
            color: var(--muted);
        }

        .detail-item-btn {
            width: 100%;
            border: none;
            background: rgba(91, 124, 250, 0.04);
            border-radius: 12px;
            padding: 10px 12px;
            text-align: left;
            cursor: pointer;
            transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
        }

        .detail-item-btn:hover {
            transform: translateY(-1px);
            background: rgba(91, 124, 250, 0.09);
            box-shadow: 0 8px 18px rgba(94, 125, 245, 0.12);
        }

        .detail-name {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .detail-name > div { min-width: 0; overflow-wrap: anywhere; }
        .ranking-display { display: block; min-width: 0; }
        .ranking-display-note { display: block; font-size: 0.72rem; line-height: 1.45; margin-top: 4px; overflow-wrap: anywhere; }

        .detail-weapon {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            object-fit: cover;
            flex: 0 0 auto;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
        }

        .detail-weapon.is-legendary {
            border: 2px solid #f5c542;
            box-shadow: 0 2px 8px rgba(245, 197, 66, 0.45);
        }

        .detail-kungfu-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }

        .detail-kungfu-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .detail-kungfu-wrap::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translate(-50%, -4px);
            background: rgba(30, 40, 55, 0.92);
            color: #ffffff;
            font-size: 0.78rem;
            padding: 4px 8px;
            border-radius: 8px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease, transform 0.15s ease;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        .detail-kungfu-wrap[data-tooltip=""]::after {
            display: none;
        }

        .detail-kungfu-wrap:hover::after {
            opacity: 1;
            transform: translate(-50%, -10px);
        }

        .detail-kungfu {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            object-fit: cover;
            background: #fff;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        .detail-kungfu.is-legendary {
            border: 2px solid #f5c542;
            box-shadow: 0 2px 8px rgba(245, 197, 66, 0.45);
        }

        .detail-rank {
            font-weight: 700;
            color: var(--ink);
        }

        .detail-score {
            text-align: right;
            color: var(--ink);
        }

        .ranking-list-card {
            grid-column: 1 / -1;
            background: rgba(255, 255, 255, 0.86);
            border: 1px solid rgba(91, 124, 250, 0.14);
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 14px 34px rgba(24, 33, 47, 0.08);
        }

        .ranking-list-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 14px;
        }

        .ranking-list-toolbar h3 {
            margin: 0 0 4px;
            font-size: 1.05rem;
        }

        .scope-inline {
            margin: 8px 0 0;
            padding: 0 4px;
            color: var(--muted);
            font-size: 0.82rem;
            line-height: 1.45;
        }

        .scope-inline strong {
            color: var(--ink);
            font-weight: 700;
        }

        .ranking-table {
            display: grid;
            gap: 8px;
        }

        .ranking-row {
            display: grid;
            grid-template-columns: 72px minmax(180px, 1.5fr) minmax(90px, 0.7fr) minmax(100px, 0.8fr) minmax(90px, 0.6fr) minmax(160px, 1fr);
            gap: 10px;
            align-items: center;
            padding: 10px 12px;
            border: 1px solid rgba(137, 196, 244, 0.18);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.72);
            color: inherit;
            text-align: left;
        }

        .ranking-row.header {
            font-size: 0.78rem;
            color: var(--muted);
            background: rgba(91, 124, 250, 0.08);
            font-weight: 700;
        }

        .ranking-row-list {
            grid-template-columns: 72px minmax(220px, 1.6fr) minmax(180px, 1fr) minmax(90px, 0.7fr) minmax(220px, 1.4fr);
        }

        .ranking-row-list .ranking-kungfu-cell {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .ranking-kungfu-icon {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            object-fit: cover;
            flex: 0 0 auto;
        }

        .match-icon-cluster {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
        }

        .peak-match-icons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            font-size: 0.8rem;
            color: var(--muted);
        }

        .peak-match-self,
        .peak-match-team {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        button.ranking-row {
            cursor: pointer;
        }

        button.ranking-row:hover {
            border-color: rgba(91, 124, 250, 0.34);
            transform: translateY(-1px);
        }

        .ranking-score {
            font-weight: 800;
            color: var(--ink);
        }

        .ranking-match-btn {
            border: none;
            background: rgba(91, 124, 250, 0.1);
            color: var(--accent);
            border-radius: 12px;
            padding: 7px 9px;
            cursor: pointer;
            font-size: 0.82rem;
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 5px;
            max-width: 100%;
            text-align: left;
        }

        .ranking-match-btn:hover {
            background: rgba(91, 124, 250, 0.16);
        }

        .ranking-match-time {
            color: var(--ink);
            font-weight: 700;
            white-space: nowrap;
        }

        .ranking-match-team-icons {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .ranking-name-btn {
            border: none;
            background: transparent;
            color: var(--ink);
            font-weight: 700;
            cursor: pointer;
            padding: 0;
            text-align: left;
        }

        .ranking-name-btn:hover {
            color: var(--accent);
        }

        @media (max-width: 860px) {
            .ranking-row {
                grid-template-columns: 54px 1fr 78px;
            }
            .ranking-row > span:nth-child(3),
            .ranking-row > span:nth-child(4),
            .ranking-row > span:nth-child(6) {
                display: none;
            }
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(24, 33, 47, 0.56);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 2000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-card {
            width: min(960px, 100%);
            max-height: min(86vh, 920px);
            overflow: auto;
            border-radius: 24px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.97), rgba(244, 249, 255, 0.98));
            border: 1px solid rgba(137, 196, 244, 0.22);
            box-shadow: 0 24px 60px rgba(24, 33, 47, 0.24);
            padding: 22px;
        }

        .modal-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
        }

        .modal-title {
            margin: 0;
            font-size: 1.18rem;
            letter-spacing: 1px;
        }

        .modal-subtitle {
            margin-top: 6px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .modal-close {
            border: none;
            background: rgba(91, 124, 250, 0.12);
            color: var(--accent);
            width: 34px;
            height: 34px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
        }

        .modal-loading,
        .modal-empty {
            padding: 18px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.82);
            border: 1px dashed rgba(94, 125, 245, 0.24);
            color: var(--muted);
        }

        .role-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .role-overview-toolbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .match-list-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin: 2px 0 10px;
        }

        .match-list-title {
            font-weight: 700;
            color: var(--ink);
            font-size: 0.95rem;
        }

        .match-list-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 10px;
        }

        .role-overview-toolbar .cache-label,
        .match-list-toolbar .cache-label {
            color: var(--muted);

                hour: "2-digit",
                minute: "2-digit",

            return date.toLocaleString("zh-CN", options);

                    const weekEntry = {
                        value: item.weekKey,
                        label: item.weekLabel,
                        weekNumber: item.weekNumber,
                        latest: item.timestampNumber,
                        items: [],
                    };
                    seasonEntry.weekMap.set(item.weekKey, weekEntry);
                    seasonEntry.weeks.push(weekEntry);
                }
                const weekEntry = seasonEntry.weekMap.get(item.weekKey);
                weekEntry.latest = Math.max(weekEntry.latest, item.timestampNumber);
                weekEntry.items.push(item);
            });
            seasons.sort(function (a, b) { return b.latest - a.latest; });
            seasons.forEach(function (seasonEntry) {
                seasonEntry.weeks.sort(function (a, b) {
                    if (a.weekNumber != null && b.weekNumber != null && a.weekNumber !== b.weekNumber) {
                        return b.weekNumber - a.weekNumber;
                    }
                    if (a.weekNumber != null && b.weekNumber == null) {
                        return -1;
                    }
                    if (a.weekNumber == null && b.weekNumber != null) {
                        return 1;
                    }
                    return b.latest - a.latest;
                });
            });
            return { seasons: seasons, seasonMap: seasonMap, items: items };
        }

        function applyRankingDisplay(member, item) {
            const shown = JSON.parse(JSON.stringify(member));
            const clear = () => Object.assign(shown, {weapon_icon: null, weapon_name: null,
                weapon_quality: null, weapon_checked: false, teammates: [], teammates_checked: false,
                self_kungfu_id: null});
            let packet = null;
            if (item && ["expired", "no_win"].includes(item.state)) return clear();
            if (item && ["available", "partial"].includes(item.state)) packet = item.packet;
            if (!packet && member.kungfu_acquisition === "live") {
                if (item) return shown;
                packet = member.display_packet;
            }
            if (!packet) return member.kungfu_acquisition === "cache" ? clear() : shown;
            clear();
            shown.self_kungfu_id = packet.self_kungfu_id || null;
            if (packet.weapon_ready === true) Object.assign(shown, {weapon_icon: packet.weapon_icon,
                weapon_name: packet.weapon_name, weapon_quality: packet.weapon_quality, weapon_checked: true});
            if (packet.team_ready === true) Object.assign(shown, {
                teammates: JSON.parse(JSON.stringify(packet.teammates || [])), teammates_checked: true});
            return shown;
        }

        function mergeRankingDisplay(previous, incoming, checkedAt) {
            if (!incoming || !Number.isFinite(checkedAt)) return previous;
            if (previous && checkedAt < previous.checked_at) return previous;
            const next = JSON.parse(JSON.stringify(incoming));
            next.checked_at = checkedAt;
            if (!previous) return next;
            const version = value => Number.isSafeInteger(value) && value > 0 ? value : 0;
            const revoked = next.state === "unavailable" && next.packet === null && next.display_version == null;
            if (revoked) return next;
            if (version(next.display_version) < version(previous.display_version)) {
                for (const key of ["display_version", "packet", "state", "missing_reasons", "match_id", "match_time", "requested_at", "verified_at"]) {
                    next[key] = JSON.parse(JSON.stringify(previous[key] ?? null));
                }
            }
            if (version(next.attempt_version) < version(previous.attempt_version)) {
                next.attempt_version = previous.attempt_version;
                next.attempt = JSON.parse(JSON.stringify(previous.attempt));
            }
            const watermark = Math.max(version(next.no_win_version), version(previous.no_win_version));
            if (watermark) next.no_win_version = watermark;
            if (watermark >= version(next.display_version) && watermark > 0) {
                next.state = "no_win";
                next.packet = null;
                next.missing_reasons = {team: "no_win", weapon: "no_win"};
            }
            return next;
        }

        function createRankingDisplayPoller(options) {
            let active = false, stopped = false, generation = 0, timer = null, pending = null, scheduledDelay = 0, waitingForTargets = true;
            let failures = 0, rangeCursor = 0;
            const cursors = new Map();
            const cancelTimer = () => { if (timer !== null) options.cancelSchedule(timer); timer = null; };
            const schedule = delay => {
                cancelTimer();
                scheduledDelay = delay;
                if (active && !stopped) timer = options.schedule(() => { timer = null; tick(); }, delay);
            };
            async function tick() {
                if (!active || stopped || pending || (timer !== null && scheduledDelay > 0 && !waitingForTargets)) return;
                cancelTimer();
                const context = options.getContext();
                if (!context || !context.visible || context.tab === "peak-game" || !context.timestamp) {
                    schedule(15000); return;
                }
                const groups = new Map();
                for (const target of context.targets || []) {
                    if (!Number.isSafeInteger(target.rank) || target.rank < 1) continue;
                    if (!groups.has(target.range)) groups.set(target.range, new Set());
                    groups.get(target.range).add(target.rank);
                }
                const ranges = [...groups.keys()];
                if (!ranges.length) { waitingForTargets = true; schedule(15000); return; }
                waitingForTargets = false;
                const range = ranges[rangeCursor++ % ranges.length];
                const all = [...groups.get(range)].sort((a, b) => a - b);
                const last = cursors.get(range) || 0;
                const ordered = [...all.filter(rank => rank > last), ...all.filter(rank => rank <= last)];
                const ranks = ordered.slice(0, 100);
                cursors.set(range, ranks[ranks.length - 1]);
                const ownGeneration = generation;
                const controller = new AbortController();
                pending = controller;
                try {
                    const data = await options.fetchBatch({timestamp: context.timestamp, range, ranks, signal: controller.signal});
                    const now = options.getContext();
                    if (!active || generation !== ownGeneration || !now.visible || now.timestamp !== context.timestamp
                        || now.tab !== context.tab || controller.signal.aborted) return;
                    if (String(data.timestamp) !== String(context.timestamp) || data.range !== range) throw new Error("资料响应不匹配");
                    options.applyBatch(data);
                    failures = 0;
                    if (data.overlay_enabled === false) stopped = true;
                } catch (error) {
                    if (active && generation === ownGeneration && !controller.signal.aborted) {
                        failures++;
                        options.onError(error);
                    }
                } finally {
                    pending = null;
                    if (generation === ownGeneration) schedule(Math.min(60000, 15000 * (2 ** Math.min(Math.max(failures - 1, 0), 2))));
                    else if (active && !stopped) schedule(0);
                }
            }
            return {
                activate() { active = true; stopped = false; failures = 0; cancelTimer(); tick(); },
                suspend() { active = false; generation++; cancelTimer(); if (pending) pending.abort(); },
                tick,
            };
        }

        function freezeRankingDisplayExport(members, records) {

        function renderRankingDisplay(member, item) {
            if (member.equipment_source === "local_win_v2" || member.local_win_packet) return renderLocalEquipmentDisplay(member);
            const shown = applyRankingDisplay(member, item);
            const icons = [];
            if (shown.weapon_icon) icons.push(`<img class="detail-weapon${isLegendaryWeapon(shown) ? " is-legendary" : ""}" src="${escapeHtml(shown.weapon_icon)}" alt="weapon" title="${escapeHtml(shown.weapon_name || "武器")}">`);

            if (selfId) icons.push(`<img class="detail-kungfu${isLegendaryWeapon(shown) ? " is-legendary" : ""}" src="https://img.jx3box.com/image/xf/${escapeHtml(selfId)}.png" alt="kungfu">`);
            for (const mate of shown.teammates || []) {
                if (mate && mate.kungfu_id) icons.push(`<span class="detail-kungfu-wrap" data-tooltip="${escapeHtml(mate.role_name || "未知")}"><img class="detail-kungfu${isLegendaryWeapon(mate) ? " is-legendary" : ""}" src="https://img.jx3box.com/image/xf/${escapeHtml(mate.kungfu_id)}.png" alt="teammate"></span>`);
            }
            const packet = item?.packet || (member.kungfu_acquisition === "live" && (!item || item.state === "unavailable") ? member.display_packet : null);
            const state = item?.state;
            let note = "";
            if (packet && [undefined, "available", "partial", "unavailable"].includes(state)) {
                note = `最近胜场配置 · 比赛 ${formatTime(packet.match_time)}`;
                if (!packet.team_ready) note += " · 队友资料缺失";
                if (!packet.weapon_ready) note += " · 武器资料缺失";
            } else if (state === "no_win") note = "最近胜场配置：近期无胜场";
            else if (state === "expired") note = "最近胜场配置：资料已过期";
            else if (member.kungfu_acquisition === "cache") note = "最近胜场配置：暂无资料";
            if (item?.attempt?.state === "failed" || (item?.attempt?.error_code && item.attempt.state !== "full")) note += `${note ? " · " : ""}最近更新失败`;
            if (item?.read_failed) note += `${note ? " · " : ""}资料检查失败`;
            return `<span class="detail-kungfu-row">${icons.join("")}</span>${note ? `<span class="ranking-display-note muted">${escapeHtml(note)}</span>` : ""}`;
        }

        function rankingDisplayRecords() {
            const key = String(currentStatsTimestamp);

        function rememberRankingDisplayMembers(members) {

        function getRankingDisplayContext() {
            const visible = document.visibilityState === "visible" && rankingDisplayExportDepth === 0
                && currentStats?.ranking_display_kind === "current";
            const targets = new Set();
            if (visible && !isPeakTab(currentOuterTab)) {
                for (const node of grid.querySelectorAll(".ranking-display[data-display-rank]")) {
                    const details = node.closest("details");
                    if (details && !details.open) continue;
                    const rect = node.getBoundingClientRect();
                    if (!node.getClientRects().length || rect.bottom <= 0 || rect.top >= window.innerHeight
                        || rect.right <= 0 || rect.left >= window.innerWidth) continue;
                    const rank = Number(node.dataset.displayRank);
                    const member = rankingDisplayMembers.get(rank);
                    if (member && ["cache", "live"].includes(member.kungfu_acquisition)
                        && Number.isSafeInteger(member.kungfu_publish_version) && member.kungfu_publish_version > 0) targets.add(rank);
                }
            }
            // All ranges contain the same frozen role at a given original rank.
            // Query once in the largest saved range, then update its visible copies.
            const range = rangeConfigs.find(config => currentStats?.kungfu_statistics?.[config.key])?.key;
            return {timestamp: String(currentStatsTimestamp), tab: currentOuterTab, visible,
                targets: [...targets].map(rank => ({range, rank}))};
        }

        function refreshRankingDisplayNodes(ranks) {
            const records = rankingDisplayRecords();
            for (const node of grid.querySelectorAll(".ranking-display[data-display-rank]")) {
                const rank = Number(node.dataset.displayRank);
                if (ranks && !ranks.has(rank)) continue;
                const raw = rankingDisplayMembers.get(rank);
                if (!raw) continue;
                const markup = renderRankingDisplay(raw, records.get(rank));
                if (node.innerHTML !== markup) node.innerHTML = markup;
            }
        }

        function applyRankingDisplayBatch(data) {
            if (String(data.timestamp) !== String(currentStatsTimestamp) || rankingDisplayExportDepth) return;
            const records = rankingDisplayRecords();
            if (data.overlay_enabled === false) {
                records.clear();
                refreshRankingDisplayNodes();
                return;
            }
            const changed = new Set();
            for (const item of data.items || []) {
                const merged = mergeRankingDisplay(records.get(item.rank), item, data.checked_at);
                if (merged) { delete merged.read_failed; records.set(item.rank, merged); changed.add(item.rank); }
            }
            refreshRankingDisplayNodes(changed);
        }

        function markRankingDisplayReadFailure() {
            const records = rankingDisplayRecords();
            const targets = getRankingDisplayContext().targets;
            for (const {rank} of targets) records.set(rank, {...(records.get(rank) || {state: "unavailable"}), read_failed: true});
            refreshRankingDisplayNodes(new Set(targets.map(target => target.rank)));
        }

        function startRankingDisplayExport() {
            rankingDisplayExportDepth++;
            suspendRankingDisplays();
            rankingDisplayFrozenExport = freezeRankingDisplayExport([...rankingDisplayMembers.values()], rankingDisplayRecords());

        function finishRankingDisplayExport() {
            rankingDisplayExportDepth = Math.max(0, rankingDisplayExportDepth - 1);
